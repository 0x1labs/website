<!doctype html>
<meta charset="utf-8">
<title>Zero One Labs header</title>
<style>
  /* 2048x1152 CSS px rendered at 2x -> 4096x2304.
     Phone shows it ~10x smaller, so no text below ~55px here. */
  :root{
    --bg:#04060B;
    --cyan:#22D3EE;
    --cyan-hot:#67E8F9;
    --violet:#8B5CF6;
    --paper:#FFFFFF;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:2048px;height:1152px;overflow:hidden;}
  body{background:var(--bg);color:var(--paper);
    font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;}

  .stage{position:relative;width:2048px;height:1152px;overflow:hidden;}

  /* ---------- atmosphere ---------- */
  .bloom-c{position:absolute;width:1500px;height:1500px;left:960px;top:-330px;
    background:radial-gradient(circle,rgba(34,211,238,.26),rgba(34,211,238,.07) 40%,transparent 66%);}
  .bloom-v{position:absolute;width:1300px;height:1300px;left:-330px;top:180px;
    background:radial-gradient(circle,rgba(139,92,246,.20),transparent 62%);}

  /* tron floor — kept on the right so it never crosses the text */
  .floorwrap{position:absolute;left:0;right:0;bottom:0;height:520px;overflow:hidden;
    -webkit-mask-image:linear-gradient(90deg,transparent 0,transparent 26%,#000 52%,#000 88%,transparent 100%);}
  .floor{position:absolute;inset:0;}
  .floor svg{width:100%;height:100%;display:block;}
  .horizon{position:absolute;left:0;right:0;top:0;height:2px;
    background:linear-gradient(90deg,transparent,rgba(103,232,249,.85) 45%,rgba(103,232,249,.6) 80%,transparent);
    box-shadow:0 0 70px 14px rgba(34,211,238,.30);}

  /* scanlines */
  .scan{position:absolute;inset:0;
    background:repeating-linear-gradient(0deg,rgba(180,240,255,.042) 0 3px,transparent 3px 12px);
    -webkit-mask-image:radial-gradient(140% 100% at 55% 45%,#000 25%,transparent 80%);}

  /* ---------- HUD ring stack behind the mascot ---------- */
  .rings{position:absolute;left:1420px;top:520px;transform:translate(-50%,-50%);}
  .ring{position:absolute;border-radius:50%;left:50%;top:50%;transform:translate(-50%,-50%);}
  .r1{width:840px;height:840px;border:3px dashed rgba(34,211,238,.5);}
  .r2{width:660px;height:660px;border:2px solid rgba(34,211,238,.3);}
  .r3{width:960px;height:960px;border:3px solid transparent;
      border-top-color:rgba(103,232,249,.75);border-right-color:rgba(103,232,249,.30);
      transform:translate(-50%,-50%) rotate(-28deg);
      filter:drop-shadow(0 0 24px rgba(34,211,238,.55));}
  .r4{width:1120px;height:1120px;border:2px solid transparent;
      border-bottom-color:rgba(139,92,246,.55);
      transform:translate(-50%,-50%) rotate(18deg);}

  /* HUD corner brackets */
  .brk{position:absolute;width:72px;height:72px;border:4px solid rgba(103,232,249,.85);
       filter:drop-shadow(0 0 16px rgba(34,211,238,.7));}
  .tl{left:1032px;top:104px;border-right:0;border-bottom:0;}
  .tr{left:1804px;top:104px;border-left:0;border-bottom:0;}
  .bl{left:1032px;top:944px;border-right:0;border-top:0;}
  .br{left:1804px;top:944px;border-left:0;border-top:0;}

  /* holo pad under the mascot */
  .pad{position:absolute;left:1420px;top:962px;transform:translate(-50%,-50%);
    width:760px;height:150px;border-radius:50%;
    background:radial-gradient(ellipse,rgba(103,232,249,.55),rgba(34,211,238,.18) 45%,transparent 72%);
    filter:blur(14px);}
  .pad-ring{position:absolute;left:1420px;top:962px;transform:translate(-50%,-50%);
    width:600px;height:118px;border-radius:50%;border:3px solid rgba(103,232,249,.65);
    filter:drop-shadow(0 0 22px rgba(34,211,238,.8));}

  .mascot{position:absolute;left:1420px;bottom:196px;transform:translateX(-50%);
    height:830px;filter:drop-shadow(0 0 44px rgba(34,211,238,.45))
                        drop-shadow(0 28px 46px rgba(0,0,0,.6));}

  /* ---------- type ---------- */
  .col{position:absolute;left:132px;top:50%;transform:translateY(-50%);width:1000px;}

  h1{font-size:182px;line-height:.94;font-weight:700;letter-spacing:-.02em;
     text-transform:uppercase;white-space:nowrap;
     text-shadow:0 0 60px rgba(120,200,255,.35);}
  h1 em{font-style:normal;color:var(--cyan-hot);
     text-shadow:0 0 26px rgba(34,211,238,.85),0 0 90px rgba(34,211,238,.55);}

  .bar{display:flex;align-items:center;gap:14px;margin:46px 0 42px;}
  .bar i{display:block;height:6px;border-radius:3px;background:var(--cyan);
     box-shadow:0 0 22px rgba(34,211,238,.9);}
  .bar i:nth-child(1){width:140px;}
  .bar i:nth-child(2){width:34px;opacity:.75;}
  .bar i:nth-child(3){width:14px;opacity:.5;}

  .lede{font-size:61px;line-height:1.38;font-weight:400;letter-spacing:-.012em;color:#AFC0D0;}
  .lede b{font-weight:600;color:var(--paper);}

  /* edge glow lines */
  .edge{position:absolute;left:0;right:0;height:3px;
    background:linear-gradient(90deg,transparent,rgba(34,211,238,.65),rgba(139,92,246,.55),transparent);}
  .edge.t{top:0;} .edge.b{bottom:0;}
  .vig{position:absolute;inset:0;
    background:radial-gradient(120% 95% at 50% 50%,transparent 42%,rgba(0,0,0,.72) 100%);}
</style>

<div class="stage">
  <div class="bloom-v"></div>
  <div class="bloom-c"></div>

  <div class="floorwrap">
    <div class="floor"><svg id="grid" viewBox="0 0 2048 520" preserveAspectRatio="none"></svg></div>
    <div class="horizon"></div>
  </div>

  <div class="rings">
    <div class="ring r4"></div>
    <div class="ring r3"></div>
    <div class="ring r1"></div>
    <div class="ring r2"></div>
  </div>

  <div class="pad"></div>
  <div class="pad-ring"></div>
  <img class="mascot" src="/Users/prajwolgyawali/Desktop/0x1/website/assets/photo/mascot/waving.png" alt="">

  <div class="brk tl"></div><div class="brk tr"></div>
  <div class="brk bl"></div><div class="brk br"></div>

  <div class="scan"></div>
  <div class="vig"></div>

  <div class="col">
    <h1>Zero One<br><em>Labs</em></h1>
    <div class="bar"><i></i><i></i><i></i></div>
    <p class="lede">Product studio.<br>
       We design and build<br>
       <b>apps and products.</b></p>
  </div>

  <div class="edge t"></div>
  <div class="edge b"></div>
</div>

<script>
// Perspective grid: rays from a vanishing point on the horizon, plus
// horizontal rungs that bunch up near the horizon.
(function(){
  const NS = "http://www.w3.org/2000/svg";
  const svg = document.getElementById("grid");
  const H = 520, VX = 1420, VY = 0;          // vanishing point sits on the horizon
  const line = (x1,y1,x2,y2,o,w) => {
    const l = document.createElementNS(NS,"line");
    l.setAttribute("x1",x1); l.setAttribute("y1",y1);
    l.setAttribute("x2",x2); l.setAttribute("y2",y2);
    l.setAttribute("stroke","#22D3EE");
    l.setAttribute("stroke-opacity",o.toFixed(3));
    l.setAttribute("stroke-width",w);
    svg.appendChild(l);
  };
  // rays
  for (let i=-14;i<=14;i++){
    const x = VX + i*300;
    line(VX,VY,x,H, 0.42, 2.5);
  }
  // rungs
  const N = 13;
  for (let i=1;i<=N;i++){
    const t = i/N;
    const y = H * Math.pow(t,2.35);
    line(-400,y,2448,y, 0.16 + 0.42*t, 2 + 2*t);
  }
})();
</script>
